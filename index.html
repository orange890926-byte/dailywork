<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人生活管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-select { user-select: none; -webkit-user-select: none; }
        .tab-btn.active { color: #3B82F6; border-bottom: 2px solid #3B82F6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col font-sans">

    <!-- 全域頂部：通用日期選擇器與好棒棒點數顯示 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-regular fa-calendar-check text-blue-500 text-xl"></i>
                <input type="date" id="globalDatePicker" class="font-bold text-gray-700 bg-gray-50 border rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1.5 rounded-full flex items-center space-x-1 shadow-sm">
                <i class="fa-solid fa-star text-amber-500"></i>
                <span>好棒棒點數: <span id="headerPointsDisplay">0</span></span>
            </div>
        </div>
        
        <!-- 底部/頂部頁籤導覽 (依指定順序：待辦 > 打卡 > 喝水打卡 > 心情日記 > 獎勵) -->
        <nav class="flex justify-around bg-white border-t border-gray-200 text-xs text-gray-500 font-medium">
            <button onclick="switchTab('todo')" id="nav-todo" class="tab-btn active py-2.5 flex-1 flex flex-col items-center">
                <i class="fa-solid fa-list-check text-base mb-0.5"></i>待辦
            </button>
            <button onclick="switchTab('habit')" id="nav-habit" class="tab-btn py-2.5 flex-1 flex flex-col items-center">
                <i class="fa-solid fa-square-check text-base mb-0.5"></i>打卡
            </button>
            <button onclick="switchTab('water')" id="nav-water" class="tab-btn py-2.5 flex-1 flex flex-col items-center">
                <i class="fa-solid fa-bottle-water text-base mb-0.5"></i>喝水打卡
            </button>
            <button onclick="switchTab('mood')" id="nav-mood" class="tab-btn py-2.5 flex-1 flex flex-col items-center">
                <i class="fa-solid fa-face-smile text-base mb-0.5"></i>心情日記
            </button>
            <button onclick="switchTab('reward')" id="nav-reward" class="tab-btn py-2.5 flex-1 flex flex-col items-center">
                <i class="fa-solid fa-trophy text-base mb-0.5"></i>獎勵
            </button>
        </nav>
    </header>

    <!-- 主要內容區域 -->
    <main class="max-w-md mx-auto w-full flex-1 p-4 pb-12">

        <!-- 1. 待辦事項 (To-Do) -->
        <section id="sec-todo" class="space-y-4">
            <div class="flex justify-between items-center bg-white p-2 rounded-lg shadow-sm">
                <span class="text-sm font-bold text-gray-600">顯示模式：</span>
                <div class="inline-flex rounded-md shadow-sm" role="group">
                    <button id="view-quadrant-btn" onclick="toggleTodoView('quadrant')" class="px-3 py-1.5 text-xs font-medium bg-blue-500 text-white rounded-l-lg">四象限</button>
                    <button id="view-list-btn" onclick="toggleTodoView('list')" class="px-3 py-1.5 text-xs font-medium bg-gray-200 text-gray-700 rounded-r-lg">條列</button>
                </div>
            </div>

            <!-- 新增待辦按鈕 -->
            <button onclick="openModal('add-todo-modal')" class="w-full py-2.5 bg-blue-500 text-white font-bold rounded-lg shadow hover:bg-blue-600 transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-plus"></i>
                <span>新增待辦事項</span>
            </button>

            <!-- 四象限檢視 -->
            <div id="todo-quadrant-view" class="grid grid-cols-2 gap-2">
                <div class="bg-red-50 p-2 rounded-lg border border-red-200 min-h-[140px]">
                    <h4 class="text-xs font-bold text-red-700 mb-2 border-b border-red-200 pb-1">重要且緊急 (Q1)</h4>
                    <div id="q1-list" class="space-y-1.5"></div>
                </div>
                <div class="bg-amber-50 p-2 rounded-lg border border-amber-200 min-h-[140px]">
                    <h4 class="text-xs font-bold text-amber-700 mb-2 border-b border-amber-200 pb-1">重要不緊急 (Q2)</h4>
                    <div id="q2-list" class="space-y-1.5"></div>
                </div>
                <div class="bg-blue-50 p-2 rounded-lg border border-blue-200 min-h-[140px]">
                    <h4 class="text-xs font-bold text-blue-700 mb-2 border-b border-blue-200 pb-1">不重要但緊急 (Q3)</h4>
                    <div id="q3-list" class="space-y-1.5"></div>
                </div>
                <div class="bg-gray-50 p-2 rounded-lg border border-gray-200 min-h-[140px]">
                    <h4 class="text-xs font-bold text-gray-700 mb-2 border-b border-gray-200 pb-1">不重要不緊急 (Q4)</h4>
                    <div id="q4-list" class="space-y-1.5"></div>
                </div>
            </div>

            <!-- 條列檢視 -->
            <div id="todo-list-view" class="hidden space-y-2">
                <div id="todo-full-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- 2. 習慣打卡 (Habit) -->
        <section id="sec-habit" class="hidden space-y-4">
            <button onclick="openModal('add-habit-modal')" class="w-full py-2.5 bg-green-500 text-white font-bold rounded-lg shadow hover:bg-green-600 transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-plus"></i>
                <span>新增習慣目標</span>
            </button>

            <div id="habit-list-container" class="space-y-3">
                <!-- 習慣列表由 JS 動態生成 -->
            </div>
        </section>

        <!-- 3. 喝水打卡 (Water) -->
        <section id="sec-water" class="hidden space-y-4">
            <!-- 當天喝水總量卡片 -->
            <div class="bg-gradient-to-br from-blue-400 to-indigo-500 text-white p-5 rounded-xl shadow-md text-center space-y-2">
                <p class="text-xs opacity-80">本日累積喝水量</p>
                <div class="text-4xl font-extrabold"><span id="todayWaterAmount">0</span> <span class="text-lg font-normal">cc</span></div>
                <p id="waterGoalText" class="text-xs bg-white/20 inline-block px-3 py-1 rounded-full">目標：2000 cc</p>
            </div>

            <!-- 容量快速按鈕區 -->
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">快速打卡</h3>
                <div id="waterCupButtons" class="grid grid-cols-3 gap-2">
                    <!-- 250cc, 600cc, 800cc & 自訂按鈕 -->
                </div>
                <button onclick="addNewWaterCup()" class="w-full text-xs text-blue-500 font-bold border border-dashed border-blue-300 py-2 rounded-lg hover:bg-blue-50">
                    + 新增杯子容量
                </button>
            </div>

            <!-- 數據展現模式 (月曆 / 直條圖) -->
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="text-sm font-bold text-gray-700">喝水紀錄圖表</h3>
                    <div class="space-x-1 text-xs">
                        <button onclick="toggleWaterChart('bar')" id="btn-water-bar" class="px-2 py-1 bg-blue-500 text-white rounded">直條圖</button>
                        <button onclick="toggleWaterChart('cal')" id="btn-water-cal" class="px-2 py-1 bg-gray-200 text-gray-700 rounded">月曆</button>
                    </div>
                </div>
                
                <!-- 直條圖視圖 -->
                <div id="water-bar-view" class="h-40 flex items-end justify-between px-2 pt-6 pb-2 border-b">
                    <!-- 動態繪製直條圖 -->
                </div>

                <!-- 月曆視圖 -->
                <div id="water-cal-view" class="hidden text-center text-xs text-gray-500 py-4">
                    <div id="waterCalendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
                </div>
            </div>
        </section>

        <!-- 4. 心情日記 (Mood) -->
        <section id="sec-mood" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-4">
                <h3 class="text-sm font-bold text-gray-700">今天的心情如何？</h3>
                <div class="flex justify-between px-2 text-3xl">
                    <button onclick="selectMood('😃')" class="mood-opt hover:scale-125 transition">😃</button>
                    <button onclick="selectMood('😊')" class="mood-opt hover:scale-125 transition">😊</button>
                    <button onclick="selectMood('😐')" class="mood-opt hover:scale-125 transition">😐</button>
                    <button onclick="selectMood('😔')" class="mood-opt hover:scale-125 transition">😔</button>
                    <button onclick="selectMood('😡')" class="mood-opt hover:scale-125 transition">😡</button>
                </div>

                <textarea id="moodJournalInput" rows="4" placeholder="寫下今天發生的事情或心得..." class="w-full p-3 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
                
                <button onclick="saveMoodEntry()" class="w-full py-2 bg-indigo-500 text-white font-bold rounded-lg shadow hover:bg-indigo-600 transition">
                    儲存日記 (+5 點數)
                </button>
            </div>

            <!-- 歷史紀錄 -->
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-2">
                <h3 class="text-sm font-bold text-gray-700">當日日記紀錄</h3>
                <div id="moodEntryDisplay" class="text-sm text-gray-600 italic border-l-2 border-indigo-400 pl-3 py-1">
                    當天尚無紀錄。
                </div>
            </div>
        </section>

        <!-- 5. 獎勵商城 (Reward) -->
        <section id="sec-reward" class="hidden space-y-4">
            <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-center space-y-1">
                <p class="text-xs text-amber-700">當前可用點數</p>
                <p class="text-3xl font-extrabold text-amber-600" id="shopPointsDisplay">0</p>
            </div>

            <button onclick="openModal('add-reward-modal')" class="w-full py-2 bg-amber-500 text-white font-bold rounded-lg shadow hover:bg-amber-600 transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-plus"></i>
                <span>新增自訂兌換商品</span>
            </button>

            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <h3 class="text-sm font-bold text-gray-700 border-b pb-2">獎勵兌換清單</h3>
                <div id="rewardListContainer" class="space-y-2">
                    <!-- 動態生成兌換清單 -->
                </div>
            </div>
        </section>

    </main>

    <!-- Modal 彈窗區 -->
    <!-- 1. 新增待辦 Modal -->
    <div id="add-todo-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-4 space-y-3">
            <h3 class="font-bold text-gray-700">新增待辦事項 (不可修改項目)</h3>
            <input type="text" id="newTodoTitle" placeholder="事項名稱..." class="w-full p-2 border rounded text-sm">
            
            <label class="block text-xs font-bold text-gray-600">四象限分類：</label>
            <select id="newTodoQuadrant" class="w-full p-2 border rounded text-sm bg-white">
                <option value="Q1">Q1: 重要且緊急</option>
                <option value="Q2">Q2: 重要不緊急</option>
                <option value="Q3">Q3: 不重要但緊急</option>
                <option value="Q4">Q4: 不重要不緊急</option>
            </select>

            <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="newTodoIsRepeat" onchange="toggleRepeatDateInput(this.checked)" class="rounded">
                <label for="newTodoIsRepeat" class="text-xs text-gray-700 font-bold">重複任務 (需設定截止日期)</label>
            </div>

            <div id="repeatEndDateContainer" class="hidden">
                <label class="block text-xs text-gray-500 mb-1">截止日期：</label>
                <input type="date" id="newTodoEndDate" class="w-full p-2 border rounded text-sm">
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal('add-todo-modal')" class="px-3 py-1.5 text-xs text-gray-500">取消</button>
                <button onclick="saveNewTodo()" class="px-3 py-1.5 text-xs bg-blue-500 text-white rounded font-bold">建立</button>
            </div>
        </div>
    </div>

    <!-- 2. 新增習慣 Modal -->
    <div id="add-habit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-4 space-y-3">
            <h3 class="font-bold text-gray-700">新增習慣目標</h3>
            <input type="text" id="newHabitTitle" placeholder="習慣名稱 (例: 敷面膜)..." class="w-full p-2 border rounded text-sm">
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-600">目標每週：</span>
                <input type="number" id="newHabitTarget" value="2" min="1" class="w-20 p-2 border rounded text-sm">
                <span class="text-xs text-gray-600">次</span>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal('add-habit-modal')" class="px-3 py-1.5 text-xs text-gray-500">取消</button>
                <button onclick="saveNewHabit()" class="px-3 py-1.5 text-xs bg-green-500 text-white rounded font-bold">建立</button>
            </div>
        </div>
    </div>

    <!-- 3. 新增商品 Modal -->
    <div id="add-reward-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-4 space-y-3">
            <h3 class="font-bold text-gray-700">新增自訂兌換商品</h3>
            <input type="text" id="newRewardTitle" placeholder="商品名稱 (例如：吃冰淇淋)..." class="w-full p-2 border rounded text-sm">
            <input type="number" id="newRewardPoints" placeholder="所需點數" class="w-full p-2 border rounded text-sm">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal('add-reward-modal')" class="px-3 py-1.5 text-xs text-gray-500">取消</button>
                <button onclick="saveNewReward()" class="px-3 py-1.5 text-xs bg-amber-500 text-white rounded font-bold">新增</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 業務邏輯 -->
    <script>
        // --- 狀態管理 ---
        let appState = {
            currentDate: new Date().toISOString().split('T')[0],
            points: 0,
            todos: [],
            habits: [],
            waterLogs: {}, // 'YYYY-MM-DD': amount
            waterCups: [250, 600, 800],
            moodLogs: {}, // 'YYYY-MM-DD': { mood, text }
            rewards: [
                { id: 1, title: '看一部電影', points: 30 },
                { id: 2, title: '吃一頓大餐', points: 100 }
            ]
        };

        let currentTodoView = 'quadrant';
        let currentWaterChartView = 'bar';
        let selectedMoodEmoji = '';

        // --- 初始化 ---
        window.onload = function() {
            loadLocalStorage();
            document.getElementById('globalDatePicker').value = appState.currentDate;
            document.getElementById('globalDatePicker').addEventListener('change', (e) => {
                appState.currentDate = e.target.value;
                renderAll();
            });
            renderAll();
        };

        function saveState() {
            localStorage.setItem('life_app_data', JSON.stringify(appState));
            renderHeaderPoints();
        }

        function loadLocalStorage() {
            const data = localStorage.getItem('life_app_data');
            if (data) {
                appState = { ...appState, ...JSON.parse(data) };
            }
        }

        function renderHeaderPoints() {
            document.getElementById('headerPointsDisplay').innerText = appState.points;
            document.getElementById('shopPointsDisplay').innerText = appState.points;
        }

        function renderAll() {
            renderHeaderPoints();
            renderTodos();
            renderHabits();
            renderWater();
            renderMood();
            renderRewards();
        }

        // --- Tab 切換 ---
        function switchTab(tabName) {
            ['todo', 'habit', 'water', 'mood', 'reward'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('active');
            });
            document.getElementById(`sec-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.add('active');
        }

        // --- 1. 待辦事項模組 ---
        function toggleTodoView(mode) {
            currentTodoView = mode;
            if (mode === 'quadrant') {
                document.getElementById('todo-quadrant-view').classList.remove('hidden');
                document.getElementById('todo-list-view').classList.add('hidden');
                document.getElementById('view-quadrant-btn').className = "px-3 py-1.5 text-xs font-medium bg-blue-500 text-white rounded-l-lg";
                document.getElementById('view-list-btn').className = "px-3 py-1.5 text-xs font-medium bg-gray-200 text-gray-700 rounded-r-lg";
            } else {
                document.getElementById('todo-quadrant-view').classList.add('hidden');
                document.getElementById('todo-list-view').classList.remove('hidden');
                document.getElementById('view-quadrant-btn').className = "px-3 py-1.5 text-xs font-medium bg-gray-200 text-gray-700 rounded-l-lg";
                document.getElementById('view-list-btn').className = "px-3 py-1.5 text-xs font-medium bg-blue-500 text-white rounded-r-lg";
            }
        }

        function toggleRepeatDateInput(checked) {
            document.getElementById('repeatEndDateContainer').classList.toggle('hidden', !checked);
        }

        function saveNewTodo() {
            const title = document.getElementById('newTodoTitle').value.trim();
            const quadrant = document.getElementById('newTodoQuadrant').value;
            const isRepeat = document.getElementById('newTodoIsRepeat').checked;
            const endDate = document.getElementById('newTodoEndDate').value;

            if (!title) return alert('請輸入事項名稱');
            if (isRepeat && !endDate) return alert('重複任務必須設定截止日期');

            const todo = {
                id: Date.now(),
                title, // 鎖定不可修改
                quadrant,
                isRepeat,
                endDate: isRepeat ? endDate : null,
                createdAt: appState.currentDate,
                isPaused: false,
                pausedDaysCount: 0,
                completedDates: []
            };

            appState.todos.push(todo);
            saveState();
            closeModal('add-todo-modal');
            document.getElementById('newTodoTitle').value = '';
            renderTodos();
        }

        function togglePauseTodo(id) {
            const todo = appState.todos.find(t => t.id === id);
            if (todo) {
                todo.isPaused = !todo.isPaused;
                saveState();
                renderTodos();
            }
        }

        function toggleCompleteTodo(id) {
            const todo = appState.todos.find(t => t.id === id);
            if (!todo) return;
            const idx = todo.completedDates.indexOf(appState.currentDate);
            if (idx >= 0) {
                todo.completedDates.splice(idx, 1);
            } else {
                todo.completedDates.push(appState.currentDate);
            }

            // 檢查當天所有待辦是否全完成，獲得獎勵
            checkAllTodosCompleted();
            saveState();
            renderTodos();
        }

        function calculateTodoDenominator(todo) {
            // 算式：總建立天數 - 暫停天數 (簡化計算 logic)
            const created = new Date(todo.createdAt);
            const current = new Date(appState.currentDate);
            const diffTime = Math.max(0, current - created);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            const denominator = Math.max(1, diffDays - (todo.pausedDaysCount || 0));
            return denominator;
        }

        function renderTodos() {
            ['q1', 'q2', 'q3', 'q4'].forEach(q => document.getElementById(`${q}-list`).innerHTML = '');
            document.getElementById('todo-full-list').innerHTML = '';

            appState.todos.forEach(todo => {
                const isDone = todo.completedDates.includes(appState.currentDate);
                const denominator = calculateTodoDenominator(todo);
                const numerator = todo.completedDates.length;

                const cardHtml = `
                    <div class="bg-white p-2 rounded shadow-sm border border-gray-100 flex flex-col justify-between text-xs space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="font-bold ${isDone ? 'line-through text-gray-400' : 'text-gray-800'}">${todo.title}</span>
                            <input type="checkbox" ${isDone ? 'checked' : ''} onclick="toggleCompleteTodo(${todo.id})" class="rounded">
                        </div>
                        ${todo.isRepeat ? `<div class="text-[10px] text-red-400">截止: ${todo.endDate}</div>` : ''}
                        <div class="flex justify-between items-center text-[10px] text-gray-400 border-t pt-1">
                            <span>完成比率: ${numerator}/${todo.isPaused ? '(暫停中)' : denominator}</span>
                            <button onclick="togglePauseTodo(${todo.id})" class="text-blue-500 font-bold">
                                ${todo.isPaused ? '恢復' : '暫停'}
                            </button>
                        </div>
                    </div>
                `;

                // 填入四象限
                const qKey = todo.quadrant.toLowerCase();
                if (document.getElementById(`${qKey}-list`)) {
                    document.getElementById(`${qKey}-list`).insertAdjacentHTML('beforeend', cardHtml);
                }

                // 條列式
                document.getElementById('todo-full-list').insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function checkAllTodosCompleted() {
            if (appState.todos.length === 0) return;
            const allDone = appState.todos.every(t => t.completedDates.includes(appState.currentDate));
            if (allDone) {
                appState.points += 10;
                alert('🎉 太棒了！今天的所有待辦事項皆已完成，獲得 10 點好棒棒點數！');
            }
        }

        // --- 2. 習慣打卡模組 (目標導向、允許超額、時間戳記、長按取消) ---
        function saveNewHabit() {
            const title = document.getElementById('newHabitTitle').value.trim();
            const target = parseInt(document.getElementById('newHabitTarget').value) || 1;
            if (!title) return alert('請輸入習慣名稱');

            appState.habits.push({
                id: Date.now(),
                title,
                target,
                logs: [] // { id, timestamp }
            });
            saveState();
            closeModal('add-habit-modal');
            document.getElementById('newHabitTitle').value = '';
            renderHabits();
        }

        function checkInHabit(habitId) {
            const habit = appState.habits.find(h => h.id === habitId);
            if (!habit) return;

            const now = new Date();
            const log = {
                id: Date.now(),
                timestamp: `${appState.currentDate} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`
            };
            habit.logs.push(log);

            // 檢查是否達成目標發放點數
            const thisWeekLogs = habit.logs.filter(l => l.timestamp.startsWith(appState.currentDate.substring(0, 7)));
            if (thisWeekLogs.length === habit.target) {
                appState.points += 15;
                alert(`🏅 恭喜達成習慣【${habit.title}】的目標！獲得 15 點好棒棒點數！`);
            }

            saveState();
            renderHabits();
        }

        function removeHabitLog(habitId, logId) {
            const habit = appState.habits.find(h => h.id === habitId);
            if (!habit) return;
            habit.logs = habit.logs.filter(l => l.id !== logId);
            saveState();
            renderHabits();
        }

        function renderHabits() {
            const container = document.getElementById('habit-list-container');
            container.innerHTML = '';

            appState.habits.forEach(habit => {
                const todayLogs = habit.logs.filter(l => l.timestamp.startsWith(appState.currentDate));
                
                let logsBadgesHtml = todayLogs.map(l => `
                    <span oncontextmenu="return false;" 
                          class="habit-badge no-select bg-green-100 text-green-800 text-[10px] px-2 py-0.5 rounded cursor-pointer border border-green-300"
                          data-habit="${habit.id}" data-log="${l.id}">
                        ${l.timestamp.split(' ')[1]} (長按取消)
                    </span>
                `).join(' ');

                const cardHtml = `
                    <div class="bg-white p-3 rounded-xl shadow-sm space-y-2 border">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${habit.title}</h4>
                                <p class="text-[10px] text-gray-400">目標：${habit.target} 次/週 | 本日已打卡 ${todayLogs.length} 次</p>
                            </div>
                            <button onclick="checkInHabit(${habit.id})" class="bg-green-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow hover:bg-green-600">
                                + 打卡
                            </button>
                        </div>
                        <div class="flex flex-wrap gap-1 pt-1 border-t">
                            ${logsBadgesHtml || '<span class="text-[10px] text-gray-400">本日尚無打卡紀錄</span>'}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            // 綁定長按事件 (防誤觸)
            setupLongPressEvents();
        }

        function setupLongPressEvents() {
            document.querySelectorAll('.habit-badge').forEach(badge => {
                let timer = null;
                const habitId = parseInt(badge.dataset.habit);
                const logId = parseInt(badge.dataset.log);

                const start = () => {
                    timer = setTimeout(() => {
                        if (confirm('確定要取消這次的打卡紀錄嗎？')) {
                            removeHabitLog(habitId, logId);
                        }
                    }, 800); // 長按 0.8 秒
                };
                const cancel = () => { if (timer) clearTimeout(timer); };

                badge.addEventListener('mousedown', start);
                badge.addEventListener('touchstart', start);
                badge.addEventListener('mouseup', cancel);
                badge.addEventListener('touchend', cancel);
            });
        }

        // --- 3. 喝水打卡模組 ---
        function addWater(amount) {
            const current = appState.waterLogs[appState.currentDate] || 0;
            appState.waterLogs[appState.currentDate] = current + amount;
            saveState();
            renderWater();
        }

        function addNewWaterCup() {
            const val = prompt('請輸入新杯子的容量 (cc):', '350');
            if (val && !isNaN(val)) {
                appState.waterCups.push(parseInt(val));
                saveState();
                renderWater();
            }
        }

        function toggleWaterChart(type) {
            currentWaterChartView = type;
            if (type === 'bar') {
                document.getElementById('water-bar-view').classList.remove('hidden');
                document.getElementById('water-cal-view').classList.add('hidden');
                document.getElementById('btn-water-bar').className = "px-2 py-1 bg-blue-500 text-white rounded";
                document.getElementById('btn-water-cal').className = "px-2 py-1 bg-gray-200 text-gray-700 rounded";
            } else {
                document.getElementById('water-bar-view').classList.add('hidden');
                document.getElementById('water-cal-view').classList.remove('hidden');
                document.getElementById('btn-water-bar').className = "px-2 py-1 bg-gray-200 text-gray-700 rounded";
                document.getElementById('btn-water-cal').className = "px-2 py-1 bg-blue-500 text-white rounded";
            }
        }

        function renderWater() {
            const todayAmount = appState.waterLogs[appState.currentDate] || 0;
            document.getElementById('todayWaterAmount').innerText = todayAmount;

            // 渲染杯子按鈕
            const cupContainer = document.getElementById('waterCupButtons');
            cupContainer.innerHTML = '';
            appState.waterCups.forEach(cc => {
                cupContainer.innerHTML += `
                    <button onclick="addWater(${cc})" class="py-2.5 bg-blue-50 border border-blue-200 text-blue-600 rounded-lg font-bold text-xs hover:bg-blue-100 flex flex-col items-center">
                        <i class="fa-solid fa-glass-water mb-1 text-sm"></i>+${cc} cc
                    </button>
                `;
            });

            // 繪製近 7 天直條圖
            const barView = document.getElementById('water-bar-view');
            barView.innerHTML = '';
            for (let i = 6; i >= 0; i--) {
                const d = new Date(appState.currentDate);
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const amt = appState.waterLogs[dateStr] || 0;
                const heightPct = Math.min(100, Math.round((amt / 2000) * 100));

                barView.innerHTML += `
                    <div class="flex flex-col items-center h-full justify-end flex-1 space-y-1">
                        <div class="text-[9px] text-gray-400">${amt}</div>
                        <div class="w-4 bg-blue-400 rounded-t" style="height: ${Math.max(5, heightPct)}%;"></div>
                        <div class="text-[9px] text-gray-500">${dateStr.substring(5)}</div>
                    </div>
                `;
            }
        }

        // --- 4. 心情日記模組 ---
        function selectMood(emoji) {
            selectedMoodEmoji = emoji;
            document.querySelectorAll('.mood-opt').forEach(btn => {
                btn.classList.toggle('opacity-30', btn.innerText !== emoji);
            });
        }

        function saveMoodEntry() {
            const text = document.getElementById('moodJournalInput').value.trim();
            if (!selectedMoodEmoji) return alert('請先選擇一個心情圖示！');

            appState.moodLogs[appState.currentDate] = {
                mood: selectedMoodEmoji,
                text
            };
            appState.points += 5; // 完成心情日記獎勵
            saveState();
            renderMood();
            alert('日記已儲存，獲得 5 點好棒棒點數！');
        }

        function renderMood() {
            const entry = appState.moodLogs[appState.currentDate];
            const display = document.getElementById('moodEntryDisplay');
            if (entry) {
                display.innerHTML = `<span class="text-2xl mr-2">${entry.mood}</span> <span>${entry.text || '（當天無填寫文字心得）'}</span>`;
            } else {
                display.innerText = '當天尚無紀錄。';
            }
        }

        // --- 5. 獎勵與兌換商城模組 ---
        function saveNewReward() {
            const title = document.getElementById('newRewardTitle').value.trim();
            const points = parseInt(document.getElementById('newRewardPoints').value);
            if (!title || isNaN(points)) return alert('請輸入完整商品資訊');

            appState.rewards.push({ id: Date.now(), title, points });
            saveState();
            closeModal('add-reward-modal');
            renderRewards();
        }

        function redeemReward(rewardId) {
            const item = appState.rewards.find(r => r.id === rewardId);
            if (!item) return;

            if (appState.points < item.points) {
                return alert('好棒棒點數不足，繼續加油！');
            }

            if (confirm(`確定要消耗 ${item.points} 點兌換【${item.title}】嗎？`)) {
                appState.points -= item.points;
                saveState();
                renderRewards();
                alert('🎉 兌換成功！好好享受你的獎勵吧！');
            }
        }

        function renderRewards() {
            const container = document.getElementById('rewardListContainer');
            container.innerHTML = '';

            appState.rewards.forEach(item => {
                container.innerHTML += `
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 border rounded-lg">
                        <div>
                            <div class="font-bold text-sm text-gray-800">${item.title}</div>
                            <div class="text-xs text-amber-600 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${item.points} 點</div>
                        </div>
                        <button onclick="redeemReward(${item.id})" class="px-3 py-1.5 bg-amber-500 text-white font-bold text-xs rounded-lg shadow hover:bg-amber-600">
                            兌換
                        </button>
                    </div>
                `;
            });
        }

        // --- 通用 Modal 控制 ---
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
    </script>
</body>
</html>
