<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬卡龍風 · 生活隨身小管家</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 圓潤字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #FAF7F2; /* 柔和馬卡龍米白底色 */
        }
        .no-select { user-select: none; -webkit-user-select: none; }
        .tab-btn.active { 
            background-color: #FFE5EC; 
            color: #FF5A8D; 
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 182, 193, 0.4);
        }

        /* 可愛畫線劃掉動畫 */
        .strike-anim {
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }
        .strike-anim::after {
            content: '';
            position: absolute;
            left: -2%;
            top: 50%;
            width: 0%;
            height: 3px;
            background: #FF85A1; /* 糖果粉紅劃線 */
            border-radius: 99px;
            transform: translateY(-50%) rotate(-1.5deg);
            transition: width 0.35s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .completed .strike-anim {
            color: #A0AEC0;
        }
        .completed .strike-anim::after {
            width: 104%;
        }

        /* 隱藏滾動條但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen text-gray-700 flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-pink-100 rounded-b-3xl shadow-sm">
        <div class="max-w-md mx-auto px-4 pt-3 pb-2 flex justify-between items-center">
            <div class="flex items-center space-x-2 bg-pink-50 px-3 py-1.5 rounded-2xl border border-pink-100">
                <span class="text-base">📅</span>
                <input type="date" id="globalDatePicker" class="bg-transparent font-bold text-xs text-pink-600 focus:outline-none">
            </div>
            <div class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1.5 rounded-2xl flex items-center space-x-1 shadow-sm border border-amber-200">
                <span>⭐</span>
                <span>好棒棒點數: <span id="headerPointsDisplay">0</span></span>
            </div>
        </div>
        
        <!-- 分頁 Tab 按鈕 (馬卡龍膠囊造型) -->
        <nav class="max-w-md mx-auto px-2 py-2 flex justify-around text-xs gap-1 no-scrollbar overflow-x-auto">
            <button onclick="switchTab('todo')" id="nav-todo" class="tab-btn active px-3 py-2 rounded-2xl flex items-center space-x-1 transition-all">
                <span>📝</span><span>待辦</span>
            </button>
            <button onclick="switchTab('habit')" id="nav-habit" class="tab-btn px-3 py-2 rounded-2xl flex items-center space-x-1 transition-all text-gray-500">
                <span>✅</span><span>打卡</span>
            </button>
            <button onclick="switchTab('water')" id="nav-water" class="tab-btn px-3 py-2 rounded-2xl flex items-center space-x-1 transition-all text-gray-500">
                <span>💧</span><span>喝水</span>
            </button>
            <button onclick="switchTab('mood')" id="nav-mood" class="tab-btn px-3 py-2 rounded-2xl flex items-center space-x-1 transition-all text-gray-500">
                <span>📖</span><span>心情</span>
            </button>
            <button onclick="switchTab('reward')" id="nav-reward" class="tab-btn px-3 py-2 rounded-2xl flex items-center space-x-1 transition-all text-gray-500">
                <span>🏆</span><span>獎勵</span>
            </button>
        </nav>
    </header>

    <!-- 主體內容區 -->
    <main class="max-w-md mx-auto w-full flex-1 p-4 space-y-4">

        <!-- 1. 待辦事項 (To-Do) -->
        <section id="sec-todo" class="space-y-3">
            <div class="flex justify-between items-center bg-white p-2.5 rounded-2xl shadow-sm border border-pink-100">
                <span class="text-xs font-bold text-gray-500">檢視視圖：</span>
                <div class="inline-flex rounded-xl bg-gray-100 p-0.5 text-xs font-bold">
                    <button id="view-quadrant-btn" onclick="toggleTodoView('quadrant')" class="px-3 py-1 rounded-lg bg-white text-pink-500 shadow-sm">四象限</button>
                    <button id="view-list-btn" onclick="toggleTodoView('list')" class="px-3 py-1 rounded-lg text-gray-400">條列</button>
                </div>
            </div>

            <button onclick="openModal('add-todo-modal')" class="w-full py-3 bg-gradient-to-r from-pink-300 to-rose-300 text-white font-bold rounded-2xl shadow-sm hover:opacity-95 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>新增待辦任務</span>
            </button>

            <!-- 四象限檢視 -->
            <div id="todo-quadrant-view" class="grid grid-cols-2 gap-2.5">
                <!-- Q1 粉紅色 -->
                <div class="bg-pink-100/70 p-2.5 rounded-2xl border border-pink-200 min-h-[150px] space-y-2">
                    <h4 class="text-[11px] font-bold text-pink-700 border-b border-pink-200 pb-1 flex items-center justify-between">
                        <span>🚨 重要且緊急</span>
                        <span class="text-[9px] opacity-70">不做會出問題</span>
                    </h4>
                    <div id="q1-list" class="space-y-2"></div>
                </div>
                <!-- Q2 淺藍色 -->
                <div class="bg-sky-100/70 p-2.5 rounded-2xl border border-sky-200 min-h-[150px] space-y-2">
                    <h4 class="text-[11px] font-bold text-sky-700 border-b border-sky-200 pb-1 flex items-center justify-between">
                        <span>🎯 重要不緊急</span>
                        <span class="text-[9px] opacity-70">中長期規劃</span>
                    </h4>
                    <div id="q2-list" class="space-y-2"></div>
                </div>
                <!-- Q3 淡黃色 -->
                <div class="bg-amber-100/70 p-2.5 rounded-2xl border border-amber-200 min-h-[150px] space-y-2">
                    <h4 class="text-[11px] font-bold text-amber-800 border-b border-amber-200 pb-1 flex items-center justify-between">
                        <span>⚡ 不重要但緊急</span>
                        <span class="text-[9px] opacity-70">不花心思速做</span>
                    </h4>
                    <div id="q3-list" class="space-y-2"></div>
                </div>
                <!-- Q4 淺綠色 -->
                <div class="bg-emerald-100/70 p-2.5 rounded-2xl border border-emerald-200 min-h-[150px] space-y-2">
                    <h4 class="text-[11px] font-bold text-emerald-800 border-b border-emerald-200 pb-1 flex items-center justify-between">
                        <span>🍃 不重要不緊急</span>
                        <span class="text-[9px] opacity-70">瑣事及雜事</span>
                    </h4>
                    <div id="q4-list" class="space-y-2"></div>
                </div>
            </div>

            <!-- 條列檢視 -->
            <div id="todo-list-view" class="hidden space-y-2">
                <div id="todo-full-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- 2. 習慣打卡 (Habit) -->
        <section id="sec-habit" class="hidden space-y-3">
            <button onclick="openModal('add-habit-modal')" class="w-full py-3 bg-gradient-to-r from-teal-300 to-emerald-300 text-white font-bold rounded-2xl shadow-sm hover:opacity-95 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>新增習慣習慣目標</span>
            </button>

            <div id="habit-list-container" class="space-y-3">
                <!-- 動態生成的習慣列表與月曆 -->
            </div>
        </section>

        <!-- 3. 喝水打卡 (Water) -->
        <section id="sec-water" class="hidden space-y-3">
            <div class="bg-gradient-to-br from-sky-200 via-blue-200 to-indigo-200 p-5 rounded-3xl shadow-sm text-center space-y-2 text-sky-900 border border-sky-200">
                <p class="text-xs font-bold opacity-80">💧 本日累積喝水量</p>
                <div class="text-4xl font-extrabold"><span id="todayWaterAmount">0</span> <span class="text-base font-normal">cc</span></div>
                <div class="inline-block bg-white/60 px-3 py-1 rounded-full text-xs font-bold text-sky-800 shadow-sm">目標：2000 cc</div>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-sky-100 space-y-3">
                <h3 class="text-xs font-bold text-gray-400">快速打卡</h3>
                <div id="waterCupButtons" class="grid grid-cols-3 gap-2"></div>
                <button onclick="addNewWaterCup()" class="w-full text-xs text-sky-500 font-bold border border-dashed border-sky-300 py-2.5 rounded-2xl hover:bg-sky-50 transition">
                    + 新增杯子容量
                </button>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-sky-100 space-y-3">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h3 class="text-xs font-bold text-gray-600">喝水紀錄圖表</h3>
                    <div class="space-x-1 text-xs font-bold">
                        <button onclick="toggleWaterChart('bar')" id="btn-water-bar" class="px-2.5 py-1 bg-sky-300 text-white rounded-xl">直條圖</button>
                        <button onclick="toggleWaterChart('cal')" id="btn-water-cal" class="px-2.5 py-1 bg-gray-100 text-gray-500 rounded-xl">月曆</button>
                    </div>
                </div>
                
                <div id="water-bar-view" class="h-36 flex items-end justify-between px-2 pt-6 pb-2 border-b border-gray-50"></div>
                <div id="water-cal-view" class="hidden text-center text-xs py-2">
                    <div id="waterCalendarGrid" class="grid grid-cols-7 gap-1"></div>
                </div>
            </div>
        </section>

        <!-- 4. 心情日記 (Mood) -->
        <section id="sec-mood" class="hidden space-y-3">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100 space-y-4">
                <h3 class="text-xs font-bold text-gray-500">今天的心情如何呢？</h3>
                <div class="flex justify-around px-2 text-3xl">
                    <button onclick="selectMood('😃')" class="mood-opt transition transform hover:scale-125">😃</button>
                    <button onclick="selectMood('😊')" class="mood-opt transition transform hover:scale-125">😊</button>
                    <button onclick="selectMood('😐')" class="mood-opt transition transform hover:scale-125">😐</button>
                    <button onclick="selectMood('😔')" class="mood-opt transition transform hover:scale-125">😔</button>
                    <button onclick="selectMood('😭')" class="mood-opt transition transform hover:scale-125">😭</button>
                </div>

                <textarea id="moodJournalInput" rows="3" placeholder="寫下今天的心情或小記事..." class="w-full p-3 border border-pink-100 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-200 bg-pink-50/30"></textarea>
                
                <button onclick="saveMoodEntry()" class="w-full py-2.5 bg-gradient-to-r from-purple-300 to-pink-300 text-white font-bold rounded-2xl shadow-sm hover:opacity-95 transition">
                    儲存日記 (+5 點數)
                </button>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100 space-y-2">
                <h3 class="text-xs font-bold text-gray-500">本日日記紀錄</h3>
                <div id="moodEntryDisplay" class="text-xs text-gray-600 bg-purple-50/50 p-3 rounded-2xl italic border border-purple-100">
                    尚無紀錄。
                </div>
            </div>
        </section>

        <!-- 5. 獎勵商城 (Reward) -->
        <section id="sec-reward" class="hidden space-y-3">
            <div class="bg-gradient-to-r from-amber-100 via-orange-100 to-amber-200 p-4 rounded-3xl text-center space-y-1 border border-amber-200 shadow-sm">
                <p class="text-xs text-amber-700 font-bold">當前累積好棒棒點數</p>
                <p class="text-3xl font-extrabold text-amber-600" id="shopPointsDisplay">0</p>
            </div>

            <button onclick="openModal('add-reward-modal')" class="w-full py-2.5 bg-amber-300 text-amber-900 font-bold rounded-2xl shadow-sm hover:bg-amber-400 transition flex items-center justify-center space-x-1 text-xs">
                <i class="fa-solid fa-plus"></i>
                <span>新增自訂兌換商品</span>
            </button>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-amber-100 space-y-3">
                <h3 class="text-xs font-bold text-gray-500 border-b border-gray-100 pb-2">獎勵兌換清單</h3>
                <div id="rewardListContainer" class="space-y-2"></div>
            </div>
        </section>

    </main>

    <!-- Modal 彈窗區 -->

    <!-- 1. 新增待辦 Modal -->
    <div id="add-todo-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-xl border border-pink-100">
            <h3 class="font-bold text-sm text-gray-700">✨ 新增待辦任務 (項目鎖定)</h3>
            
            <div class="flex space-x-2">
                <input type="text" id="newTodoEmoji" value="📝" class="w-12 text-center p-2 border rounded-xl text-lg">
                <input type="text" id="newTodoTitle" placeholder="任務名稱..." class="flex-1 p-2 border rounded-xl text-xs">
            </div>

            <label class="block text-xs font-bold text-gray-500">四象限分類：</label>
            <select id="newTodoQuadrant" class="w-full p-2 border rounded-xl text-xs bg-white">
                <option value="Q1">Q1: 重要且緊急 (粉紅)</option>
                <option value="Q2">Q2: 重要不緊急 (淺藍)</option>
                <option value="Q3">Q3: 不重要但緊急 (淡黃)</option>
                <option value="Q4">Q4: 不重要不緊急 (淺綠)</option>
            </select>

            <label class="block text-xs font-bold text-gray-500">重複設定：</label>
            <select id="newTodoRepeatType" onchange="handleRepeatTypeChange(this.value)" class="w-full p-2 border rounded-xl text-xs bg-white">
                <option value="none">不重複 (單次任務)</option>
                <option value="daily">每天重複</option>
                <option value="weekly">每周重複 (可選星期)</option>
                <option value="monthly">每月重複</option>
            </select>

            <!-- 每周選項 -->
            <div id="weeklyDaysContainer" class="hidden space-y-1">
                <span class="text-[10px] text-gray-400">選擇重複星期：</span>
                <div class="flex justify-between text-xs">
                    <label><input type="checkbox" value="0" class="week-day-cb">日</label>
                    <label><input type="checkbox" value="1" class="week-day-cb">一</label>
                    <label><input type="checkbox" value="2" class="week-day-cb">二</label>
                    <label><input type="checkbox" value="3" class="week-day-cb">三</label>
                    <label><input type="checkbox" value="4" class="week-day-cb">四</label>
                    <label><input type="checkbox" value="5" class="week-day-cb">五</label>
                    <label><input type="checkbox" value="6" class="week-day-cb">六</label>
                </div>
            </div>

            <div id="repeatEndDateContainer" class="hidden">
                <label class="block text-xs text-gray-400">截止日期：</label>
                <input type="date" id="newTodoEndDate" class="w-full p-2 border rounded-xl text-xs">
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal('add-todo-modal')" class="px-3 py-1.5 text-xs text-gray-400">取消</button>
                <button onclick="saveNewTodo()" class="px-4 py-1.5 text-xs bg-pink-400 text-white rounded-xl font-bold">建立</button>
            </div>
        </div>
    </div>

    <!-- 2. 新增習慣 Modal -->
    <div id="add-habit-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-xl border border-teal-100">
            <h3 class="font-bold text-sm text-gray-700">🌿 新增習慣打卡</h3>
            <div class="flex space-x-2">
                <input type="text" id="newHabitEmoji" value="💊" class="w-12 text-center p-2 border rounded-xl text-lg">
                <input type="text" id="newHabitTitle" placeholder="習慣名稱 (例: 吃維他命C)..." class="flex-1 p-2 border rounded-xl text-xs">
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-500">目標每週：</span>
                <input type="number" id="newHabitTarget" value="3" min="1" class="w-20 p-2 border rounded-xl text-xs">
                <span class="text-xs text-gray-500">次</span>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal('add-habit-modal')" class="px-3 py-1.5 text-xs text-gray-400">取消</button>
                <button onclick="saveNewHabit()" class="px-4 py-1.5 text-xs bg-teal-400 text-white rounded-xl font-bold">建立</button>
            </div>
        </div>
    </div>

    <!-- 3. 新增商品 Modal -->
    <div id="add-reward-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-xl border border-amber-100">
            <h3 class="font-bold text-sm text-gray-700">🎁 新增兌換獎勵</h3>
            <input type="text" id="newRewardTitle" placeholder="獎勵名稱 (例: 看電影)..." class="w-full p-2 border rounded-xl text-xs">
            <input type="number" id="newRewardPoints" placeholder="所需點數" class="w-full p-2 border rounded-xl text-xs">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeModal('add-reward-modal')" class="px-3 py-1.5 text-xs text-gray-400">取消</button>
                <button onclick="saveNewReward()" class="px-4 py-1.5 text-xs bg-amber-400 text-white rounded-xl font-bold">新增</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 業務邏輯 -->
    <script>
        let appState = {
            currentDate: new Date().toISOString().split('T')[0],
            points: 0,
            todos: [],
            habits: [],
            waterLogs: {},
            waterCups: [250, 600, 800],
            moodLogs: {},
            rewards: [
                { id: 1, title: '喝一杯珍奶 🧋', points: 40 },
                { id: 2, title: '看一部電影 🎬', points: 80 }
            ]
        };

        let currentTodoView = 'quadrant';
        let currentWaterChartView = 'bar';
        let selectedMoodEmoji = '';

        window.onload = function() {
            loadLocalStorage();
            document.getElementById('globalDatePicker').value = appState.currentDate;
            document.getElementById('globalDatePicker').addEventListener('change', (e) => {
                appState.currentDate = e.target.value;
                renderAll();
            });
            renderAll();
        };

        function saveState() {
            localStorage.setItem('macaron_life_data', JSON.stringify(appState));
            renderHeaderPoints();
        }

        function loadLocalStorage() {
            const data = localStorage.getItem('macaron_life_data');
            if (data) {
                appState = { ...appState, ...JSON.parse(data) };
            }
        }

        function renderHeaderPoints() {
            document.getElementById('headerPointsDisplay').innerText = appState.points;
            document.getElementById('shopPointsDisplay').innerText = appState.points;
        }

        function renderAll() {
            renderHeaderPoints();
            renderTodos();
            renderHabits();
            renderWater();
            renderMood();
            renderRewards();
        }

        function switchTab(tabName) {
            ['todo', 'habit', 'water', 'mood', 'reward'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('active');
                document.getElementById(`nav-${t}`).classList.add('text-gray-500');
            });
            document.getElementById(`sec-${tabName}`).classList.remove('hidden');
            const navBtn = document.getElementById(`nav-${tabName}`);
            navBtn.classList.add('active');
            navBtn.classList.remove('text-gray-500');
        }

        // --- 1. 待辦事項模組 ---
        function toggleTodoView(mode) {
            currentTodoView = mode;
            if (mode === 'quadrant') {
                document.getElementById('todo-quadrant-view').classList.remove('hidden');
                document.getElementById('todo-list-view').classList.add('hidden');
                document.getElementById('view-quadrant-btn').className = "px-3 py-1 rounded-lg bg-white text-pink-500 shadow-sm";
                document.getElementById('view-list-btn').className = "px-3 py-1 rounded-lg text-gray-400";
            } else {
                document.getElementById('todo-quadrant-view').classList.add('hidden');
                document.getElementById('todo-list-view').classList.remove('hidden');
                document.getElementById('view-quadrant-btn').className = "px-3 py-1 rounded-lg text-gray-400";
                document.getElementById('view-list-btn').className = "px-3 py-1 rounded-lg bg-white text-pink-500 shadow-sm";
            }
        }

        function handleRepeatTypeChange(val) {
            const isRepeat = val !== 'none';
            document.getElementById('repeatEndDateContainer').classList.toggle('hidden', !isRepeat);
            document.getElementById('weeklyDaysContainer').classList.toggle('hidden', val !== 'weekly');
        }

        function saveNewTodo() {
            const emoji = document.getElementById('newTodoEmoji').value.trim() || '📝';
            const title = document.getElementById('newTodoTitle').value.trim();
            const quadrant = document.getElementById('newTodoQuadrant').value;
            const repeatType = document.getElementById('newTodoRepeatType').value;
            const endDate = document.getElementById('newTodoEndDate').value;

            if (!title) return alert('請輸入任務名稱');
            if (repeatType !== 'none' && !endDate) return alert('重複任務必須設定截止日期');

            let repeatDays = [];
            if (repeatType === 'weekly') {
                document.querySelectorAll('.week-day-cb:checked').forEach(cb => {
                    repeatDays.push(parseInt(cb.value));
                });
            }

            const todo = {
                id: Date.now(),
                emoji,
                title,
                quadrant,
                repeatType,
                repeatDays,
                endDate: repeatType !== 'none' ? endDate : null,
                createdAt: appState.currentDate,
                isPaused: false,
                pausedDates: [],
                leaveDates: [], // 請假日期
                delayedDates: {}, // 'YYYY-MM-DD': count
                completedDates: []
            };

            appState.todos.push(todo);
            saveState();
            closeModal('add-todo-modal');
            document.getElementById('newTodoTitle').value = '';
            renderTodos();
        }

        function toggleCompleteTodo(id) {
            const todo = appState.todos.find(t => t.id === id);
            if (!todo) return;
            const idx = todo.completedDates.indexOf(appState.currentDate);
            if (idx >= 0) {
                todo.completedDates.splice(idx, 1);
            } else {
                todo.completedDates.push(appState.currentDate);
            }
            saveState();
            renderTodos();
        }

        function takeLeaveTodo(id) {
            const todo = appState.todos.find(t => t.id === id);
            if (!todo) return;
            if (!todo.leaveDates.includes(appState.currentDate)) {
                todo.leaveDates.push(appState.currentDate);
                alert(`🏖️ 已針對【${todo.title}】請假一次，不納入今日計算！`);
            } else {
                todo.leaveDates = todo.leaveDates.filter(d => d !== appState.currentDate);
            }
            saveState();
            renderTodos();
        }

        function delayTodo(id) {
            const todo = appState.todos.find(t => t.id === id);
            if (!todo) return;
            // 自動順延至下一天
            const curr = new Date(appState.currentDate);
            curr.setDate(curr.getDate() + 1);
            const nextDate = curr.toISOString().split('T')[0];
            
            if (!todo.leaveDates.includes(appState.currentDate)) {
                todo.leaveDates.push(appState.currentDate); // 當天視為順延移出
            }
            alert(`⏰ 任務【${todo.title}】已自動延遲移至下一天 (${nextDate})！`);
            saveState();
            renderTodos();
        }

        function togglePauseTodo(id) {
            const todo = appState.todos.find(t => t.id === id);
            if (todo) {
                todo.isPaused = !todo.isPaused;
                saveState();
                renderTodos();
            }
        }

        function renderTodos() {
            ['q1', 'q2', 'q3', 'q4'].forEach(q => document.getElementById(`${q}-list`).innerHTML = '');
            document.getElementById('todo-full-list').innerHTML = '';

            appState.todos.forEach(todo => {
                const isDone = todo.completedDates.includes(appState.currentDate);
                const isLeave = todo.leaveDates.includes(appState.currentDate);

                const cardHtml = `
                    <div class="bg-white p-2.5 rounded-xl shadow-sm border border-gray-100 space-y-1.5 ${isDone ? 'completed' : ''}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-1.5 overflow-hidden">
                                <span class="text-sm">${todo.emoji}</span>
                                <span class="strike-anim text-xs font-bold ${isLeave ? 'text-amber-500 line-through' : 'text-gray-700'}">${todo.title}</span>
                            </div>
                            <input type="checkbox" ${isDone ? 'checked' : ''} onclick="toggleCompleteTodo(${todo.id})" class="rounded text-pink-400 focus:ring-pink-300">
                        </div>

                        ${isLeave ? '<div class="text-[9px] text-amber-500 font-bold">🏖️ 今日已請假/順延</div>' : ''}

                        <div class="flex justify-between items-center text-[9px] text-gray-400 pt-1 border-t border-gray-50">
                            <div class="space-x-1">
                                <button onclick="delayTodo(${todo.id})" class="text-blue-400 hover:underline">⏰ 延遲</button>
                                ${todo.repeatType !== 'none' ? `<button onclick="takeLeaveTodo(${todo.id})" class="text-amber-500 hover:underline">🏖️ 請假</button>` : ''}
                            </div>
                            <button onclick="togglePauseTodo(${todo.id})" class="text-gray-400">
                                ${todo.isPaused ? '▶️ 恢復' : '⏸️ 暫停'}
                            </button>
                        </div>
                    </div>
                `;

                const qKey = todo.quadrant.toLowerCase();
                if (document.getElementById(`${qKey}-list`)) {
                    document.getElementById(`${qKey}-list`).insertAdjacentHTML('beforeend', cardHtml);
                }
                document.getElementById('todo-full-list').insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // --- 2. 習慣打卡模組 (含習慣月曆圖標顯示) ---
        function saveNewHabit() {
            const emoji = document.getElementById('newHabitEmoji').value.trim() || '💊';
            const title = document.getElementById('newHabitTitle').value.trim();
            const target = parseInt(document.getElementById('newHabitTarget').value) || 1;
            if (!title) return alert('請輸入習慣名稱');

            appState.habits.push({
                id: Date.now(),
                emoji,
                title,
                target,
                logs: []
            });
            saveState();
            closeModal('add-habit-modal');
            document.getElementById('newHabitTitle').value = '';
            renderHabits();
        }

        function checkInHabit(habitId) {
            const habit = appState.habits.find(h => h.id === habitId);
            if (!habit) return;
            const now = new Date();
            const log = {
                id: Date.now(),
                timestamp: `${appState.currentDate} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`
            };
            habit.logs.push(log);
            saveState();
            renderHabits();
        }

        function removeHabitLog(habitId, logId) {
            const habit = appState.habits.find(h => h.id === habitId);
            if (!habit) return;
            habit.logs = habit.logs.filter(l => l.id !== logId);
            saveState();
            renderHabits();
        }

        function renderHabits() {
            const container = document.getElementById('habit-list-container');
            container.innerHTML = '';

            appState.habits.forEach(habit => {
                const todayLogs = habit.logs.filter(l => l.timestamp.startsWith(appState.currentDate));
                
                let logsBadges = todayLogs.map(l => `
                    <span class="habit-badge bg-teal-50 text-teal-700 border border-teal-200 text-[9px] px-2 py-0.5 rounded-full cursor-pointer"
                          data-habit="${habit.id}" data-log="${l.id}">
                        ${l.timestamp.split(' ')[1]} (長按刪除)
                    </span>
                `).join(' ');

                const cardHtml = `
                    <div class="bg-white p-3.5 rounded-3xl shadow-sm border border-teal-100 space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <span class="text-xl">${habit.emoji}</span>
                                <div>
                                    <h4 class="font-bold text-xs text-gray-700">${habit.title}</h4>
                                    <p class="text-[9px] text-gray-400">目標：${habit.target} 次/週 | 本日打卡: ${todayLogs.length} 次</p>
                                </div>
                            </div>
                            <button onclick="checkInHabit(${habit.id})" class="bg-teal-300 text-teal-900 text-xs px-3 py-1.5 rounded-2xl font-bold shadow-sm hover:bg-teal-400 transition">
                                + 打卡
                            </button>
                        </div>

                        <div class="flex flex-wrap gap-1 border-t border-gray-50 pt-2">
                            ${logsBadges || '<span class="text-[9px] text-gray-300">本日尚無打卡紀錄</span>'}
                        </div>

                        <!-- 習慣專屬月曆展現 -->
                        <div class="bg-teal-50/40 p-2 rounded-2xl space-y-1">
                            <div class="text-[9px] font-bold text-teal-700 text-center">打卡月曆</div>
                            <div id="habit-cal-${habit.id}"></div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
                renderHabitCalendarGrid(habit, `habit-cal-${habit.id}`);
            });

            setupLongPressEvents();
        }

        // 渲染打卡月曆 (顯示專屬圖標 💊)
        function renderHabitCalendarGrid(habit, containerId) {
            const current = new Date(appState.currentDate);
            const year = current.getFullYear();
            const month = current.getMonth();

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = `
                <div class="grid grid-cols-7 gap-1 text-center text-[8px] font-bold text-gray-400 mb-1">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center">
            `;

            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasLog = habit.logs.some(l => l.timestamp.startsWith(dateStr));
                const isToday = dateStr === appState.currentDate;

                let bgClass = "bg-white text-gray-400";
                if (hasLog) bgClass = "bg-pink-100 text-pink-600 font-bold border border-pink-200 shadow-xs";
                if (isToday) bgClass += " ring-1 ring-teal-300";

                html += `
                    <div class="p-1 rounded-xl ${bgClass} h-7 flex flex-col items-center justify-center text-[9px]">
                        <span>${day}</span>
                        ${hasLog ? `<span class="text-[10px]">${habit.emoji}</span>` : ''}
                    </div>
                `;
            }
            html += `</div>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function setupLongPressEvents() {
            document.querySelectorAll('.habit-badge').forEach(badge => {
                let timer = null;
                const habitId = parseInt(badge.dataset.habit);
                const logId = parseInt(badge.dataset.log);

                const start = () => {
                    timer = setTimeout(() => {
                        if (confirm('要取消這次的打卡嗎？')) {
                            removeHabitLog(habitId, logId);
                        }
                    }, 800);
                };
                const cancel = () => { if (timer) clearTimeout(timer); };

                badge.addEventListener('mousedown', start);
                badge.addEventListener('touchstart', start);
                badge.addEventListener('mouseup', cancel);
                badge.addEventListener('touchend', cancel);
            });
        }

        // --- 3. 喝水打卡模組 ---
        function addWater(amount) {
            const current = appState.waterLogs[appState.currentDate] || 0;
            appState.waterLogs[appState.currentDate] = current + amount;
            saveState();
            renderWater();
        }

        function addNewWaterCup() {
            const val = prompt('輸入新杯子容量 (cc):', '350');
            if (val && !isNaN(val)) {
                appState.waterCups.push(parseInt(val));
                saveState();
                renderWater();
            }
        }

        function toggleWaterChart(type) {
            currentWaterChartView = type;
            document.getElementById('water-bar-view').classList.toggle('hidden', type !== 'bar');
            document.getElementById('water-cal-view').classList.toggle('hidden', type !== 'cal');
            document.getElementById('btn-water-bar').className = type === 'bar' ? "px-2.5 py-1 bg-sky-300 text-white rounded-xl" : "px-2.5 py-1 bg-gray-100 text-gray-500 rounded-xl";
            document.getElementById('btn-water-cal').className = type === 'cal' ? "px-2.5 py-1 bg-sky-300 text-white rounded-xl" : "px-2.5 py-1 bg-gray-100 text-gray-500 rounded-xl";
        }

        function renderWater() {
            const todayAmount = appState.waterLogs[appState.currentDate] || 0;
            document.getElementById('todayWaterAmount').innerText = todayAmount;

            const cupContainer = document.getElementById('waterCupButtons');
            cupContainer.innerHTML = '';
            appState.waterCups.forEach(cc => {
                cupContainer.innerHTML += `
                    <button onclick="addWater(${cc})" class="py-2 bg-sky-50 border border-sky-100 text-sky-600 rounded-2xl font-bold text-xs hover:bg-sky-100 transition flex flex-col items-center">
                        <span class="text-xs mb-0.5">🥛</span>+${cc} cc
                    </button>
                `;
            });

            // 繪製直條圖
            const barView = document.getElementById('water-bar-view');
            barView.innerHTML = '';
            for (let i = 6; i >= 0; i--) {
                const d = new Date(appState.currentDate);
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const amt = appState.waterLogs[dateStr] || 0;
                const heightPct = Math.min(100, Math.round((amt / 2000) * 100));

                barView.innerHTML += `
                    <div class="flex flex-col items-center h-full justify-end flex-1 space-y-1">
                        <div class="text-[8px] text-gray-400">${amt}</div>
                        <div class="w-3.5 bg-sky-300 rounded-t-lg" style="height: ${Math.max(5, heightPct)}%;"></div>
                        <div class="text-[8px] text-gray-400">${dateStr.substring(5)}</div>
                    </div>
                `;
            }
        }

        // --- 4. 心情日記模組 (最後一個情緒替換為😭) ---
        function selectMood(emoji) {
            selectedMoodEmoji = emoji;
            document.querySelectorAll('.mood-opt').forEach(btn => {
                btn.classList.toggle('opacity-30', btn.innerText !== emoji);
            });
        }

        function saveMoodEntry() {
            const text = document.getElementById('moodJournalInput').value.trim();
            if (!selectedMoodEmoji) return alert('請先選擇一個心情圖示！');

            appState.moodLogs[appState.currentDate] = {
                mood: selectedMoodEmoji,
                text
            };
            appState.points += 5;
            saveState();
            renderMood();
            alert('日記儲存成功！獲得 5 點點數！');
        }

        function renderMood() {
            const entry = appState.moodLogs[appState.currentDate];
            const display = document.getElementById('moodEntryDisplay');
            if (entry) {
                display.innerHTML = `<span class="text-2xl mr-2">${entry.mood}</span> <span>${entry.text || '（今天沒有留下文字）'}</span>`;
            } else {
                display.innerText = '尚無紀錄。';
            }
        }

        // --- 5. 獎勵商城模組 ---
        function saveNewReward() {
            const title = document.getElementById('newRewardTitle').value.trim();
            const points = parseInt(document.getElementById('newRewardPoints').value);
            if (!title || isNaN(points)) return alert('請輸入完整資訊');

            appState.rewards.push({ id: Date.now(), title, points });
            saveState();
            closeModal('add-reward-modal');
            renderRewards();
        }

        function redeemReward(rewardId) {
            const item = appState.rewards.find(r => r.id === rewardId);
            if (!item) return;

            if (appState.points < item.points) {
                return alert('好棒棒點數還不夠喔，繼續努力！');
            }

            if (confirm(`確定要兌換【${item.title}】嗎？`)) {
                appState.points -= item.points;
                saveState();
                renderRewards();
                alert('🎉 兌換成功！好好獎勵一下自己吧！');
            }
        }

        function renderRewards() {
            const container = document.getElementById('rewardListContainer');
            container.innerHTML = '';

            appState.rewards.forEach(item => {
                container.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-amber-50/50 border border-amber-100 rounded-2xl">
                        <div>
                            <div class="font-bold text-xs text-gray-700">${item.title}</div>
                            <div class="text-[10px] text-amber-600 font-bold">⭐ ${item.points} 點</div>
                        </div>
                        <button onclick="redeemReward(${item.id})" class="px-3 py-1.5 bg-amber-300 text-amber-900 font-bold text-xs rounded-xl shadow-xs hover:bg-amber-400 transition">
                            兌換
                        </button>
                    </div>
                `;
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
    </script>
</body>
</html>
